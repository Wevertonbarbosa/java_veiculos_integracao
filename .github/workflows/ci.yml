
name: Vehicle Integration - CI

# Define quando o pipeline será executado.
on:
  push:
  pull_request:

# Permissões necessárias para publicar imagens no GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Autentica no GHCR somente em push na branch main.
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Constrói a imagem Docker com duas tags.
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/wevertonbarbosa/vehicle-integration:latest \
            -t ghcr.io/wevertonbarbosa/vehicle-integration:${{ github.sha }} \
            .

      # Publica a imagem no GitHub Container Registry.
      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags ghcr.io/wevertonbarbosa/vehicle-integration
